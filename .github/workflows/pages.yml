name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (core only, no browser needed for unit tests)
        run: pip install -q pytest httpx openai python-dotenv
      - name: Unit tests
        run: pytest tests/test_units.py -q

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble docs/ site from web console
        run: |
          mkdir -p docs
          cp web/index.html web/app.js docs/
          # optional: if a sample ledger exists, ship it for read-only Pages view
          if [ -f runs/ledger.sample.json ]; then
            mkdir -p docs/runs && cp runs/ledger.sample.json docs/runs/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
