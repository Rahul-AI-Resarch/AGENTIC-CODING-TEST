name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core + contract tests
        # Both suites are standard-library only — no pip install required.
        run: |
          python3 tests/test_core.py
          python3 tests/test_contract.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: html/package-lock.json

      - name: Install console deps
        run: npm ci
        working-directory: html

      - name: Typecheck + build console
        run: npm run build
        working-directory: html
